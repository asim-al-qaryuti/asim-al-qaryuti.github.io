# يجلب المقاطع الجديدة من قناة الشيخ كل 6 ساعات، ويحدّث الموقع ثم ينشره.
# يعمل أيضًا عند كل رفع للملفات، ويمكن تشغيله يدويًا من تبويب Actions.
name: تحديث يوتيوب ونشر الموقع

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: جلب المقاطع الجديدة من يوتيوب
        run: python3 tools/update_youtube.py
        continue-on-error: true

      - name: حفظ التحديث في المستودع
        run: |
          if ! git diff --quiet -- data/youtube.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/youtube.js
            git commit -m "تحديث مقاطع يوتيوب"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
