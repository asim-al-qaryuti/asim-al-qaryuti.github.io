# يجلب المقاطع الجديدة من قناة الشيخ كل 6 ساعات، ويولّد ملفات JSON لتطبيق الجوال، ثم ينشر الموقع.
# يعمل أيضًا عند كل رفع للملفات (فأي تعديل على content.js أو articles.js يحدّث JSON)، ويمكن تشغيله يدويًا من تبويب Actions.
name: تحديث يوتيوب ونشر الموقع

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: جلب المقاطع الجديدة من يوتيوب
        run: python3 tools/update_youtube.py
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # إن كان في البيانات خطأ (ملف معطوب، معرّف مكرر، ملف كتاب مفقود) يتوقف هنا فلا يُنشر شيء، ويبقى الموقع الحالي
      - name: توليد ملفات JSON لتطبيق الجوال
        run: node tools/build_json.mjs

      - name: حفظ التحديث في المستودع
        run: |
          git add data/youtube.js data/json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "تحديث تلقائي: مقاطع يوتيوب وملفات JSON"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
